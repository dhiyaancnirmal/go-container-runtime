name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on
      - name: Kernel and cgroup info
        run: |
          uname -a
          cat /sys/fs/cgroup/cgroup.controllers
      - name: Unit build and vet
        run: |
          go vet ./...
          go build ./...
      - name: Integration tests (root)
        run: make test
